# What a production run sends - real text, one file per length, nested across lengths.
#
# The text is gutenberg rows of the GLM tokenized dataset, 65,536 tokens a row and a book's rows in a run,
# decoded once. Each file is ShareGPT-shaped, which is what sglang's random dataset reads: the client
# tokenizes an entry, cuts it to exactly the length and sends the ids. Entry i starts at the same row at
# every length, so the first L tokens of stream i are a prefix of every longer prompt of it and the ladder is
# nested.
#
# The production records time these files byte for byte, and their sha256 are in the manifest beside them.

name: production
kind: workload
path: ${root:data/workloads/production}
about: three nested gutenberg prompts at each of nine lengths from 16k to 10M GLM-5.3-Flash tokens
tokenized: glm53_flash
source: gutenberg
file: "gutenberg_{length}.json"
lengths: [16384, 32768, 131072, 262144, 524288, 1048576, 2097152, 5242880, 10485760]
entries: 3
