# Software-engineering agent trajectories from Open-SWE-Traces - the OpenHands and SWE-agent subsets of the
# Qwen3.5-122B split.
#
# The revision is the head on 2026-07-17. The dataset has since been restructured, so this layout is only
# readable at this commit. NVIDIA credits itself under CC BY 4.0 on top of each repository's own licence,
# which is the one in the `manifest.parquet` beside the shards.

name: swe
kind: source
path: ${root:data/sources/swe}
about: software-engineering agent trajectories from Open-SWE-Traces
dataset: nvidia/Open-SWE-Traces
revision: 9c0e4579a4ee0effa3e5f7a552494a045f29377d
subsets: [openhands, sweagent]
split: qwen35_122b
licence: per-document

# Collected from the head of the dataset in the order it streams, kept at 64k tokens and over
# Each trajectory is kept where its repository's licence is one of those listed in `lsa.data.collect`
# Collection stops at the first batch that takes the kept tokens past 3B
collector: traces
min_tokens: 65536
max_tokens: 3000000000
count_tokenizer: HuggingFaceTB/SmolLM3-3B-Base
count_tokenizer_revision: d78a42f79198603e614095753484a04c10c2b940
