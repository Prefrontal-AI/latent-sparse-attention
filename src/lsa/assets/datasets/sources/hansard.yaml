# UK parliamentary debates, as Common Pile filtered them.
#
# The revision is the head on 2026-07-17, the day it was collected. The `manifest.parquet` beside the shards
# says what upstream says, which is not always enough: upstream calls every document the Open Parliament
# Licence, and 780 of them are the Scottish Parliament, Northern Ireland Assembly and Senedd's.

name: hansard
kind: source
