# US Government Publishing Office documents, as Common Pile filtered them.
#
# The revision is the head on 2026-07-17, the day it was collected. Each document's licence is in the
# `manifest.parquet` beside the shards.

name: usgpo
kind: source
path: ${root:data/sources/usgpo}
about: US Government Publishing Office documents from Common Pile
dataset: common-pile/usgpo_filtered
revision: b150cc22211de4d57f1b7f570097a00e65042424
licence: per-document

# Collected as one row of the hub dataset a document, kept at 64k tokens and over
# Collection stops at the first batch that takes the kept tokens past 3B
collector: text
min_tokens: 65536
max_tokens: 3000000000
count_tokenizer: HuggingFaceTB/SmolLM3-3B-Base
count_tokenizer_revision: d78a42f79198603e614095753484a04c10c2b940
