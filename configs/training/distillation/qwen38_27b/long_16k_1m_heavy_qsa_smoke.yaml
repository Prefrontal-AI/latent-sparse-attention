# The QSA recipe for a few hundred steps - whether its loss falls and what its read holds, not an indexer to keep.
#
# Two short held-out sets in place of nine, as the LSA smoke reads.
#
#     lsa distill train configs/training/distillation/qwen38_27b/long_16k_1m_heavy_qsa_smoke.yaml \
#         --gpus 8 --cpus 64 --mem-gb 1200 --hours 4
#         (inside the site's reservation)

defaults:
  - long_16k_1m_heavy_qsa
  - _self_

data:
  evaluate:
    - {name: 16k, source: qwen38_27b, sources: [arxiv, code, doab, games, gutenberg, hansard, swe, usgpo, wikimedia], split: eval, lengths: [16384], limit: 2}
    - {name: 1m, source: qwen38_27b, sources: [arxiv, code, doab, games, gutenberg, hansard, swe, usgpo, wikimedia], split: eval, lengths: [1048576], limit: 1}

run:
  name: long_16k_1m_heavy_qsa_smoke

  optim:
    steps: 480

  report:
    every: 160
    log_every: 16

  wandb:
    enabled: false
