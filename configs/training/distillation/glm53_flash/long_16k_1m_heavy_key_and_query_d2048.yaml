# The heavy-d2048-lr3e-4 recipe on the key and query, trained from the x cache - the map the evaluation
# battery serves (`glm53_flash__long-16k-1M-heavy-d2048-lr3e-4-latent.pt`), reproduced on this trainer.
#
# The indexer reads GLM's key latent and every head's query summed, `input: key_and_query` with `query_heads: all`, as
# the server does under the same setting. Neither is in the cache: the layer's own attention reads them off the cached
# `x` once a document is on the card. The maps act in the latent bases the original implementation distilled in - the key latent carried
# by `L`, the summed query by `L^-T`, `L L^T` the metric the key maps impose - start at the PCA of the carried keys, and
# are saved with the bases folded in, so `lsa distill export` writes what the server reads off the plain latent.
#
# The original implementation's recipe was the dense target cut to the teacher's 2048 strongest keys under the forward KL, 48,000 steps at
# 3e-4, batch 128, steps drawn by token, the temperature calibrated per layer - all kept. What this trainer changes by
# design: the visibility rule is this cache's (past 4 sinks, at least 512 back, query positions from 516) where the original
# implementation's saw closed 8192-key blocks, the documents stream through the rolling pool, the PCA and the temperature are
# taken from a sample of documents rather than one, and the held-out sets are this cache's.
#
#     lsa distill train configs/training/distillation/glm53_flash/long_16k_1m_heavy_key_and_query_d2048.yaml \
#         --shards 11 --mem-gb 300 --hours 12 --partition <partition>
#     lsa distill export $LSA_ROOT/training/distillation/glm53_flash/long_16k_1m_heavy_key_and_query_d2048 \
#         $LSA_ROOT/models/maps/glm53_flash__long-16k-1M-heavy-key-and-query-d2048.pt

defaults:
  - long_16k_1m_heavy_x
  - _self_

model:
  indexer:
    input: key_and_query
    query_heads: all

data:
  # The x cache with the key and query in place of `x` - the same tensors this run read off `x`, a fifth of the
  # bytes; `configs/data/targets/glm53_flash/long_16k_1m_heavy_key_and_query.yaml` extracts it
  root: ${root:data/targets/glm53_flash/long_16k_1m_heavy_key_and_query}

run:
  name: long_16k_1m_heavy_key_and_query_d2048

  objective:
    target: dense
    target_depth: 2048

  optim:
    steps: 48000
    lr: 0.0003

  report:
    every: 8000

  wandb:
    prefix: glm53flash-distill-heavy-key-and-query-d2048
    tags: [glm53_flash, distill, long_16k_1m, long_16k_1m_heavy, key_and_query, target_depth]
