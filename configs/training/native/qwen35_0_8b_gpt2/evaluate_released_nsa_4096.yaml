# The paper's NSA 128k decay selecting 64 blocks of 64 keys, scored from its released checkpoint.
# `evaluate` takes the checkpoint from here, so `--checkpoint` is not needed.
defaults:
  - decay_fineweb128k_nsa
  - _self_

run:
  name: released-decay128k-nsa-4096
  evaluation:
    checkpoint: ${root:training/native/released/decay128k-nsa-4096/checkpoint/step-5866}

attention:
  select_block_count: 64
