# The paper's Full Attention 128k decay, scored from its released checkpoint.
# `evaluate` takes the checkpoint from here, so `--checkpoint` is not needed.
defaults:
  - decay_fineweb128k
  - _self_

run:
  name: released-decay128k-dense
  evaluation:
    checkpoint: ${root:training/native/released/decay128k-dense/checkpoint/step-5866}
