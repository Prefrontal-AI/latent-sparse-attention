# D1m - a sliding window of 1,536 keys and 4 sinks on the multi-query shape, 1,540 keys a query, the budget the sparse
# arms read on this shape match.

defaults:
  - base
  - _self_

model:
  query_head_count: 8
  kv_head_count: 1
  head_dim: 128
  rotary_dim: 0

run:
  name: window-mqa8

attention:
  kind: window
  window_size: 1536
  sink_size: 4
