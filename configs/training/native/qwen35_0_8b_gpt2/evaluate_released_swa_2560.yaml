# The paper's SWA 128k decay reading a window of 2,560 keys, scored from its released checkpoint.
# `evaluate` takes the checkpoint from here, so `--checkpoint` is not needed.
defaults:
  - decay_fineweb128k_window
  - _self_

run:
  name: released-decay128k-swa-2560
  evaluation:
    checkpoint: ${root:training/native/released/decay128k-swa-2560/checkpoint/step-5866}

attention:
  window_size: 2560
