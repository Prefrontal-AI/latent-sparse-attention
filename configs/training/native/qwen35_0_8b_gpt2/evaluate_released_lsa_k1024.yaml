# The paper's N-LSA 128k decay reading 1,024 long-range keys, scored from its released checkpoint.
# `evaluate` takes the checkpoint from here, so `--checkpoint` is not needed.
defaults:
  - decay_fineweb128k_lsa
  - _self_

run:
  name: released-decay128k-lsa-1024
  evaluation:
    checkpoint: ${root:training/native/released/decay128k-lsa-1024/checkpoint/step-5866}

attention:
  top_k: 1024
