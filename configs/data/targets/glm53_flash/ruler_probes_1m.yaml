# The RULER probe set at 1M - `ruler_probes_128k.yaml`'s five tasks, queries and layers over 1,000,000-token prompts,
# 8 rows a task drawn the same way for this length: `random.Random(f"ruler-probes-{task}-1000000").sample(range(20, 100), 8)`,
# sorted, from ids 20 to 99 and with no filtering on any outcome.
#
# About 10.7 GiB a prompt over 11 layers at 1M tokens, some 430 GiB for the 40 (arithmetic).
#
#     lsa distill targets configs/data/targets/glm53_flash/ruler_probes_1m.yaml \
#         --mem-gb 175 --workers 5
#         (inside the site's reservation)
defaults:
- ruler_probes_128k
- _self_
data:
  prepared:
    length: 1000000
    source_rows:
      niah_single_2: [25, 29, 31, 33, 47, 55, 56, 64]
      niah_multikey_1: [27, 32, 33, 37, 46, 50, 54, 96]
      niah_multikey_2: [30, 33, 41, 65, 72, 80, 91, 94]
      niah_multikey_3: [22, 30, 52, 63, 64, 69, 74, 83]
      cwe: [31, 37, 58, 61, 64, 72, 74, 79]
run:
  name: ruler_probes_1m
  output: ${root:data/targets/glm53_flash/ruler_probes_1m}
