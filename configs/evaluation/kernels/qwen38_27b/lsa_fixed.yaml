# The fixed design on Qwen3.8-27B - one level of node buckets over each block of 1,024 buckets, and a beam of 2,048.
#
# [The flat configuration](lsa_flat.yaml) with the design's knobs changed and nothing else, the values of [the scored
# lsa_fixed.yaml](../../accuracy/qwen38_27b/lsa_fixed_tp1.yaml).

defaults:
  - lsa_flat
  - _self_

model:
  indexer:
    top_level: 1
    node_bucket_size: 4
    node_cluster_block_size: 1024
    beam_width: 2048

run:
  name: qwen38_27b_kernels_lsa_fixed
