# The tree design on Qwen3.8-27B - node buckets level after level, the beam started at the lowest level of at
# most 32,768 and kept at 2,048 down every level, so the cost grows with the logarithm of the context.
#
# [The flat configuration](lsa_flat.yaml) with the design's knobs changed and nothing else, the values of [the scored
# lsa_tree.yaml](../../accuracy/qwen38_27b/lsa_tree_tp1.yaml).

defaults:
  - lsa_flat
  - _self_

model:
  indexer:
    top_level: 16
    node_bucket_size: 4
    node_cluster_block_size: 4096
    beam_width: 2048
    start_nodes: 32768
  serving:
    node_centroid_precision: fp8

run:
  name: qwen38_27b_kernels_lsa_tree
