# The third PISA set beside [the stock PISA kernel timing](pisa.yaml) and [the 8-key set](pisa_c8.yaml) - leaf blocks of 16 keys and a keep count of 288, so a query still reads 4,608 keys.
#
# The harness arms the layer from the model block, which writes `model.pisa` into the settings file it reads, so this times the layer [the scored 16-key set](../../accuracy/qwen38_27b/pisa_c16_tp1.yaml) serves.
# The ladder is the base's, and the leaf means and pyramid are the one index a key head holds, 4 times as many blocks as the stock's.

defaults:
  - pisa
  - _self_

model:
  pisa:
    block_size: 16
    keep_count: 288

run:
  name: qwen38_27b_kernels_pisa_c16
