# [b300_lsa_flat.yaml](b300_lsa_flat.yaml) with an early budget, the prefill phase - 2,048 keys with top-p 512 before position
# 1,048,576 and its own 4,096 and 1,024 after, the knob values of [the scored lsa_flat_early_budget.yaml](../../accuracy/glm53_flash/lsa_flat_early_budget_tp8.yaml).
#
# A delta on the no-budget B300 layer, so the two differ in the early budget alone. The base's chunk of 32,768 and ladder
# stand, as the no-budget prefill record was timed.

defaults:
  - b300_lsa_flat
  - _self_

model:
  indexer:
    early_budget:
      position: 1048576
      top_k: 2048
      top_p: 512

data:
  phase: prefill

run:
  name: glm53_flash_kernels_lsa_flat_early_budget

sweep:
  data.phase: [prefill]
