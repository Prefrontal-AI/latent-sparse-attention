# [b300_lsa_flat.yaml](b300_lsa_flat.yaml) with an early budget, the decode phase - 2,048 keys with top-p 512 before position
# 1,048,576 and its own 4,096 and 1,024 after, the knob values of [the scored lsa_flat_early_budget.yaml](../../accuracy/glm53_flash/lsa_flat_early_budget_tp8.yaml).
#
# A delta on the no-budget B300 layer, in the chunk of 32,768 both phases take (8,192 only if that runs out of memory at a context, noted in the record).
# The ladder stops at 1M: a query is early only below position 1,048,576, so the decode at exactly 1M reads the full
# budget and equals the no-budget decode. It is kept to match the no-budget ladder; 131,072 and 524,288 are the early reads.

defaults:
  - b300_lsa_flat
  - _self_

model:
  indexer:
    early_budget:
      position: 1048576
      top_k: 2048
      top_p: 512

data:
  phase: decode
  chunk: 32768
  contexts: [131072, 524288, 1048576]

run:
  name: glm53_flash_kernels_lsa_flat_early_budget

sweep:
  data.phase: [decode]
