# `lsa_tree_cp8_10m.yaml` with the decode descending as `lsa_tree_descend_tp8.yaml` does, at 2M, 5M and 10M under
# context parallel.
# The descend is captured in the decode CUDA graph, one request at a time as the ultralong layout sends them.

defaults:
  - lsa_tree_cp8_10m
  - _self_

model:
  serving:
    decode: descend

run:
  name: glm53_flash_lsa_tree_descend_cp8_10m
