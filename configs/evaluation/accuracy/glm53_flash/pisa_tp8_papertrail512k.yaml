# `pisa_tp8.yaml` on the three PaperTrail samples at 512,000 tokens and their not-in-corpus questions - the 64-key blocks of the block-size appendix.
#
# The server is `pisa_tp8.yaml`'s with a context of 1,050,000 tokens.

defaults:
  - pisa_tp8
  - _self_

data:
  suite: full
  tasks:
    - papertrail_exoplanets_L512000
    - papertrail_exoplanets_L512000_nic
    - papertrail_ml_longctx_L512000
    - papertrail_ml_longctx_L512000_nic
    - papertrail_qec_L512000
    - papertrail_qec_L512000_nic

run:
  name: glm53_flash_pisa_tp8_papertrail512k
  serve:
    context-length: 1050000
