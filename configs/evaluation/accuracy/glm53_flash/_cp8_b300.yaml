# Not a run - a design scored under context parallel on one B300 node, laid over its configuration as its last default.
#
# [_cp8.yaml](_cp8.yaml)'s mesh and request budget on the B300 changes [the B300 CP8 timing](../../production/glm53_flash/_cp8_b300.yaml)
# takes: the B300 CP image, a tilelang prefill (sglang's trtllm read skips the DCP gather on Blackwell), FlashInfer's trtllm
# GEMM for the block-fp8 projections, and FlashInfer's autotune off.
# It is the output check those timings are gated on: a timing cannot see a read of the wrong rows, a score can.
# The suite is RULER's cwe at 512k, where the B300 TP8 gate scored, with niah_multikey_2, which a wrong read would
# drop, and at 2M - past the 1.31M tokens where the wrong read
# crashed - cwe, which every design scores near 0 there, with niah_multikey_2 and fwe, which they score high on H200.

defaults:
  - _image_b300
  - _self_

data:
  suite: ruler
  tasks: [ruler_cwe_524288, ruler_niah_multikey_2_524288, ruler_cwe_2000000, ruler_niah_multikey_2_2000000, ruler_fwe_2000000]

run:
  # DeepGEMM's sampled warmup, where the full sweep is 534 s of a 555 s start, and its masked layout, which keeps expert-parallel MoE off a slower kernel - about 90 s at 10M
  environment:
    SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
    SGLANG_DEEPGEMM_STANDARD_LAYOUT: masked
  hours: 12
  serve:
    context-length: 2100000
    max-total-tokens: 265000
    chunked-prefill-size: 32768
    mem-fraction-static: 0.85
    max-running-requests: 16
    cuda-graph-max-bs-decode: 16
    watchdog-timeout: 1800
    attention-backend: dsa
    reasoning-parser: glm45
    enable-cache-report: true
    enable-prefill-cp: true
    cp-strategy: contiguous
    attn-cp-size: 8
    dcp-size: 8
    dcp-comm-backend: ag_rs
    ep-size: 8
    dsa-prefill-backend: tilelang
    dsa-decode-backend: tilelang
    kv-cache-dtype: bfloat16
    moe-runner-backend: deep_gemm
    dcp-prefill-sparse-gather: true
    fp8-gemm-backend: flashinfer_trtllm
    disable-flashinfer-autotune: true
