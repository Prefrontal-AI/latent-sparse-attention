# `lsa_flat_tp8.yaml` on RULER at 5M and 10M tokens, on the first context-parallel server with a chunk of 32768 - `_cp8_10m_early_chunk32768.yaml` says what that is.
#
# Both lengths run in one launch, since the server serves 10.5M tokens.

defaults:
  - lsa_flat_tp8
  - _cp8_10m
  - _cp8_10m_early_chunk32768
  - _self_

data:
  lengths: [5000000, 10000000]

run:
  name: glm53_flash_lsa_flat_cp8_ruler5m_10m
