# The LongBench v2 part of [the 16-key PISA set](pisa_c16_tp8_512k.yaml) - the 60 fixed documents, one at a time.
# Leaf blocks of 16 keys and a keep count of 288 read the 4,608 keys the stock list does.
#
# Run it with `uv run lsa evaluate accuracy configs/evaluation/accuracy/glm53_flash/pisa_c16_tp8_longbench.yaml`.
#
# It is one of five parts that together cover the tasks of the stock PISA record, with [the 128k and 512k RULER run](pisa_c16_tp8_512k.yaml).
# The server is that run's in every argument but the ones named here.
# The documents are prepared to 884,736 tokens, so the context is 1,048,576 - the least the 163,840 budget leaves room for, which the runner checks before it samples.
# The longest request the stock record saw was 912,325 tokens.
# The pool is sized from about 34.4 GiB a card at the 0.75 fraction, less the fp32 means and pyramid every layer keeps for each request-table row and one layer's 10 GiB selection peak.
# One running request keeps the fixed share at about 5.5 GiB at that context, which leaves a pool of about 1.81M slots - one request with its whole budget, and 0.76M over.
# A second row would take the pool to 1.28M, which holds a document, but the part keeps the 8-key part's one request so the block size is the only change.
#
# Named apart from the stock run, so its records never file under it.

defaults:
  - pisa_c16_tp8_512k
  - _self_

data:
  suite: full
  lengths: []
  tasks:
    - longbench2

run:
  name: glm53_flash_pisa_c16_tp8_longbench
  serve:
    context-length: 1048576
    max-running-requests: 1
