# `lsa_flat_tp8.yaml` on PaperTrail, on the server of the paper's 1M-5M cells - `_cp8_papertrail5m.yaml` says what that is.

defaults:
  - lsa_flat_tp8
  - _cp8_10m
  - _cp8_papertrail5m
  - _self_

run:
  name: glm53_flash_lsa_flat_cp8_papertrail5m
  concurrency_scale: 2
  serve:
    max-running-requests: 2
    cuda-graph-max-bs-decode: 2
