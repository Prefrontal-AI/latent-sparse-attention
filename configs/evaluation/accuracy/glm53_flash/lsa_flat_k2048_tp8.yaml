# Flat reading GLM's own budget of 2,048 keys - selection quality at equal attention cost.
# Top-p rides with top-k, at 512 buckets.
#
# Written as a delta on the base, so this run differs from the baseline in the attention path and the indexer
# alone. The indexer's input and the map it reads are the base's.

defaults:
  - _base
  - _self_

model:
  attention: lsa
  indexer:
    top_k: 2048
    top_p: 512

data:
  suite: full

run:
  name: glm53_flash_lsa_flat_k2048_tp8
