# The dense baseline on one card - Qwen3.8-27B under its YaRN, and the ceiling an LSA configuration is read against.
#
# The battery's protocol, short half: GPQA Diamond, MATH-500 and AIME25, and RULER's thirteen tasks at
# 4,096, 32,768 and 131,072 with the suite's fixed rows. The rest - RULER at 524,288 and 1,000,000, LongBench v2 and PaperTrail -
# needs more than this server's 262,144 and is the long half, [`full_tp1_1m.yaml`](full_tp1_1m.yaml).
# The tasks are named rather than left to the length check, because a LongBench v2 row past the context is sent
# and scored wrong rather than skipped.

defaults:
  - _base
  - _self_

model:
  attention: native

data:
  suite: full
  tasks:
    - gpqa_diamond
    - math500
    - aime25
    - ruler_niah_single_1_4096
    - ruler_niah_single_2_4096
    - ruler_niah_single_3_4096
    - ruler_niah_multikey_1_4096
    - ruler_niah_multikey_2_4096
    - ruler_niah_multikey_3_4096
    - ruler_niah_multiquery_4096
    - ruler_niah_multivalue_4096
    - ruler_vt_4096
    - ruler_cwe_4096
    - ruler_fwe_4096
    - ruler_qa_squad_4096
    - ruler_qa_hotpot_4096
    - ruler_niah_single_1_32768
    - ruler_niah_single_2_32768
    - ruler_niah_single_3_32768
    - ruler_niah_multikey_1_32768
    - ruler_niah_multikey_2_32768
    - ruler_niah_multikey_3_32768
