# The original PISA design on Qwen3.8-27B, served as a second selector beside LSA - leaf blocks of 64 keys under a binary
# mean-pooled pyramid, searched coarse to fine with a beam of 72 blocks and the first, previous and current blocks forced,
# so a query reads 4,608 keys against LSA's 4,612.
# As the paper selects, a list is one key-value head's: its rotated keys, its six query heads' rotated queries, a block scored
# by the LogSumExp over its children of the softmax scale times each head's dot, summed over the six - so each key head reads
# its own list, with nothing exchanged between ranks.
#
# Written as a delta on [the dense baseline](full_tp1.yaml), so this run differs from it in the attention path alone, and from
# [the flat design](lsa_flat_tp1.yaml) in the selector. It reads no map.
# The server is the flat design's, a list read at a page of one token, with the prefill CUDA graph off - a prefill's search is
# eager, and a decode step's is captured.

defaults:
  - full_tp1
  - _self_

model:
  attention: pisa

run:
  name: qwen38_27b_pisa_tp1
  note: PISA a key-value head, YaRN factor 40
  serve:
    attention-backend: fa3
    page-size: 1
    disable-prefill-cuda-graph: true
