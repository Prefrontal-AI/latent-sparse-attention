# Not a run - the first battery's long half on one card, to 1M, laid over a configuration.
#
# It is `_tp1_early.yaml`'s server with the 27 tasks of the long half the paper uses: LongBench v2 and RULER's thirteen tasks at 524,288 and 1,000,000.
# The first battery also ran graph walks at 128k and 256k, which the paper does not use and a current suite no longer has.

defaults:
  - _tp1_early
  - _self_

