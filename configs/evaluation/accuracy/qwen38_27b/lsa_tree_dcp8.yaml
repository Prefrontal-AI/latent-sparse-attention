# The tree design past one card - [the tree configuration](lsa_tree_tp1.yaml) on the mesh
# [the flat one](lsa_flat_dcp8.yaml) says, tensor parallel 8 with decode context parallel 8.
#
# Every rank grows the same tree from its whole bucket cache and the index keys the group sums.

defaults:
  - lsa_tree_tp1
  - lsa_flat_dcp8
  - _self_

run:
  name: qwen38_27b_lsa_tree_dcp8
  note: tree, key and query input, YaRN factor 40, tp 8 dcp 8
  serve:
    dcp-size: 8
