# Not a run - the first battery's short half on one card, laid over a configuration.
#
# It is `_tp1_early.yaml`'s server with the 42 tasks of the short half the paper uses: GPQA-Diamond, MATH500, AIME25 and RULER's thirteen tasks at 4,096, 32,768 and 131,072.
# The first battery also ran graph walks at 128k, which the paper does not use and a current suite no longer has.
# The data root is left to the suite's default, and graph walks and LongBench v2 sampled up to 32,768 tokens where a current run gives them 163,840.

defaults:
  - _tp1_early
  - _self_

data:
  root: ""
  tasks:
  - gpqa_diamond
  - math500
  - aime25
  - ruler_niah_single_1_4096
