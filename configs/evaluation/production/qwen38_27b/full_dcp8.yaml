# The dense baseline timed on one node to 10M - tensor parallel 8 with decode context parallel 8, the mesh
# [the scored dense run past 1M](../../accuracy/qwen38_27b/full_dcp8.yaml) is served on, and the workload's whole ladder.
#
# Its server, with the production base's metrics and without strict thinking or a grammar backend, since the client
# sends token ids. The prefill chunk and budget are 32,768, as for [the flat timing on this mesh](lsa_flat_dcp8.yaml)
# and every other Qwen timing - so the two differ in the attention alone.
# Every length is one warmup and three requests, so the 10M step alone is four prefills of about 75 minutes.

defaults:
  - full_tp1
  - _self_

data:
  # The whole of `production_qwen38` - its last step is the context less the 256-token answer
  lengths: [131072, 262144, 524288, 1048576, 2097152, 5242880, 10485504]

run:
  name: qwen38_27b_full_dcp8
  tp: 8
  hours: 24
  serve:
    context-length: 10485760
    prefill-attention-backend: fa3
    decode-attention-backend: triton
    # The triton decode splits a head's context into at most 8 pieces by default, which holds dense decode 7-8 times
    # below its own best at long context with the same greedy tokens
    # => 128, as the scored dense run serves - LSA and QSA read through FlashAttention, which this does not reach
    triton-attention-num-kv-splits: 128
    dcp-size: 8
    dcp-comm-backend: ag_rs
    mem-fraction-static: 0.85
    max-running-requests: 2
    watchdog-timeout: 1800
