# The flat design timed on one node to 10M - tensor parallel 8 with decode context parallel 8, the mesh
# [the scored flat run past 1M](../../accuracy/qwen38_27b/lsa_flat_dcp8.yaml) is served on, and the workload's whole ladder.
#
# Its server, with the production base's metrics and without strict thinking or a grammar backend, since the client
# sends token ids: the index replicated on every rank, fa3 prefilling and triton decoding, a page of one token, and the
# 32,768 prefill chunk, [the dense timing on this mesh](full_dcp8.yaml)'s too.
# The fixed and tree designs have not been served on this mesh for Qwen and are left out.

defaults:
  - lsa_flat_tp1
  - _self_

data:
  # The whole of `production_qwen38` - its last step is the context less the 256-token answer
  lengths: [131072, 262144, 524288, 1048576, 2097152, 5242880, 10485504]

run:
  name: qwen38_27b_lsa_flat_dcp8
  tp: 8
  hours: 24
  serve:
    context-length: 10485760
    prefill-attention-backend: fa3
    decode-attention-backend: triton
    dcp-size: 8
    dcp-comm-backend: ag_rs
    mem-fraction-static: "0.80"
    max-running-requests: 2
    watchdog-timeout: 1800
    attention-backend: null
