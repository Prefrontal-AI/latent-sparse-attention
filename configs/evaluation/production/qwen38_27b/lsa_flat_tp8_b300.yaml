# [lsa_flat_tp1](lsa_flat_tp1.yaml) timed on one B300 node under tensor parallel 8 without decode context parallel - [_tp8_b300_sparse.yaml](_tp8_b300_sparse.yaml) says what that changes.

defaults:
  - lsa_flat_tp1
  - _tp8_b300_sparse
  - _self_

# The design's kernels in CuTeDSL, as the H200 records the paper's table reads were served
model:
  serving:
    kernels: cutedsl

run:
  name: qwen38_27b_lsa_flat_tp8
