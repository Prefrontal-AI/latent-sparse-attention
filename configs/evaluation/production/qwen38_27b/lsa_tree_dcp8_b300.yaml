# [lsa_tree_tp1](lsa_tree_tp1.yaml) timed on one B300 node under decode context parallel - [_dcp8_b300_sparse.yaml](_dcp8_b300_sparse.yaml) says what that changes.

defaults:
  - lsa_tree_tp1
  - _dcp8_b300_sparse
  - _self_

# The design's kernels in CuTeDSL, as the H200 records the paper's table reads were served
model:
  serving:
    kernels: cutedsl

run:
  name: qwen38_27b_lsa_tree_dcp8
