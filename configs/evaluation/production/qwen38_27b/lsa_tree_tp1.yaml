# The tree design on Qwen3.8-27B timed - [the flat timing](lsa_flat_tp1.yaml) with the design's knobs changed, and the static
# fraction at 0.925, the least whose pool holds the ladder's 1M step.

defaults:
  - lsa_flat_tp1
  - _self_

model:
  indexer:
    top_level: 16
    node_bucket_size: 4
    node_cluster_block_size: 4096
    beam_width: 2048
    start_nodes: 32768
  serving:
    node_centroid_precision: fp8

run:
  name: qwen38_27b_lsa_tree_tp1
  serve:
    mem-fraction-static: 0.925
