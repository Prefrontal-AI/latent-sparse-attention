# `lsa_flat_dcp8.yaml` reading half the budget, 2,048 keys at 512 buckets, timed on the same mesh and ladder.
#
# The model block of [the scored configuration](../../accuracy/qwen38_27b/lsa_flat_k2048_tp1.yaml) of the same name, so the
# two records describe one configuration. The server is the dense timing's mesh, as for the flat design.

defaults:
  - lsa_flat_dcp8
  - _self_

model:
  indexer:
    top_k: 2048
    top_p: 512

run:
  name: qwen38_27b_lsa_flat_k2048_dcp8
