# [lsa_flat_tp8_b300.yaml](lsa_flat_tp8_b300.yaml) with an early budget - 2,048 keys with top-p 512 before position 1,048,576 and
# its own 4,096 and 1,024 after, the knob values of [the scored lsa_flat_early_budget_tp8.yaml](../../accuracy/glm53_flash/lsa_flat_early_budget_tp8.yaml).
#
# A delta on the no-budget B300 run, so the two differ in the early budget alone: the same node, mesh, image and ladder.

defaults:
  - lsa_flat_tp8_b300
  - _self_

model:
  indexer:
    early_budget:
      position: 1048576
      top_k: 2048
      top_p: 512

run:
  name: glm53_flash_lsa_flat_early_budget_tp8
