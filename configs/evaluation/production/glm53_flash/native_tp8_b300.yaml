# [native_tp8](native_tp8.yaml) timed one request at a time on one B300 node - [_tp8_b300.yaml](_tp8_b300.yaml) says what that changes.

defaults:
  - native_tp8
  - _tp8_b300
  - _self_

# Decode runs on trtllm, sglang's Blackwell DSA bf16 decode default.
# The LSA arms keep flashmla_sparse in _tp8_b300.yaml: their read is our design.
# The KV cache is already spelled "bf16", which trtllm accepts ("bfloat16" it does not).
# `serve` is _tp8_b300.yaml's but for `dsa-decode-backend`.

run:
  name: glm53_flash_native_tp8
  serve:
    dsa-decode-backend: trtllm
