# [lsa_tree_tp8](lsa_tree_tp8.yaml) timed one request at a time on one B300 node - [_cp8_b300.yaml](_cp8_b300.yaml) says what that changes.

defaults:
  - lsa_tree_tp8
  - _cp8_b300
  - _self_

# The design's kernels in CuTeDSL, as the H200 records the paper's table reads were served
model:
  serving:
    kernels: cutedsl

run:
  name: glm53_flash_lsa_tree_cp8
