# The flat design - every bucket scored by one fused scan and a threshold select, the cost linear in the context.
# It is the accuracy result the other designs are read against.
#
# Timed one request at a time, with the model block of [the scored
# configuration](../../accuracy/glm53_flash/lsa_flat_tp8.yaml) of the same name, so the two records describe one
# configuration. The indexer's input and the map it reads are the base's.

defaults:
  - _base
  - _self_

model:
  attention: lsa

run:
  name: glm53_flash_lsa_flat_tp8
