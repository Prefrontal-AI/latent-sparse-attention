# Flat reading GLM's own budget of 2,048 keys - selection quality at equal attention cost.
# Top-p rides with top-k, at 512 buckets.
#
# Timed one request at a time, with the model block of [the scored
# configuration](../../accuracy/glm53_flash/lsa_flat_k2048_tp8.yaml) of the same name, so the two records describe one
# configuration. The indexer's input and the map it reads are the base's.

defaults:
  - _base
  - _self_

model:
  attention: lsa
  indexer:
    top_k: 2048
    top_p: 512

run:
  name: glm53_flash_lsa_flat_k2048_tp8
