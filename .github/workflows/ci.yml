name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref - a new push cancels the old one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job installs the locked environment on a GitHub-hosted runner and runs one Makefile target.
# The test targets deselect the `gpu` and `cluster` markers, which no runner can serve, and fail on any other skip.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: uv-0.13
      - run: make sync
      - run: make lint

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: uv-0.13
      - run: make sync
      - run: make types

  # A bare sync resolves the extras' packages to Any, which hides their type errors
  types-evaluation-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: uv-0.13
      - run: uv sync --locked --extra evaluation
      - run: make types

  # A bare sync, which also proves the package imports without an extra
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: uv-0.13
      - run: make sync
      - run: make test-core

  test-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: uv-0.13
      - run: uv sync --locked --extra evaluation
      - run: make test-evaluation

  # causal-conv1d's setup.py reads the CUDA toolkit version and dies on a runner with no nvcc
  test-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: uv-0.13
      - run: uv sync --locked --extra training --no-install-package causal-conv1d
      - run: make test-training
